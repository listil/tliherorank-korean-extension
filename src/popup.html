  <section class="info">
    <div class="infoRow">
      <span>사전 항목 수</span>
      <strong id="entryCount">-</strong>
    </div>
  </section>

  <footer>
    번역 데이터 출처: <a href="https://tlidb.com/ko/" target="_blank" rel="noopener noreferrer">tlidb.com</a>
